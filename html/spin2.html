<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle with Rotating Squares</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      body {
  background-color: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

@keyframes colfade{
  from { background-color: #000000; }
    to   { background-color: #6BDE1F; }
}

.square {
    position: absolute;
    width: 100px;
    height: 100px;
    background-color: black;
    border: 5px solid green;
    border-radius: 10%;
    cursor: pointer;
    transform-origin: 50px 50px;
}


.square:hover {
  background-color: lime;
  animation: colfade;
  animation-delay: 0s;
  animation-duration: 0.5s;
  animation-fill-mode: forwards;
}

#triangle {
    position: relative;
    width: 346px;
    height: 300px;
    transform-origin: 173px 150px;
}


</style>
</head>
<body>
  <div id="triangle">
    <div class="square" id="square1" style="top: -60px; left: 123px;"></div>
    <div class="square" id="square2" style="top: 200px; left: -27px;"></div>
    <div class="square" id="square3" style="top: 200px; left: 273px;"></div>
</div>

<script>
  let rotation = 0;
        let squareRotation = 0;
        let spinning = false;
        let rotationSpeed = 0.5;
        let acceleration = 0.05;

        function spin() {
    if (spinning) {
        rotationSpeed += acceleration;
        rotation += rotationSpeed;
        $('#triangle').css({
            'transform': `rotate(${rotation}deg)`
        });
        $('.square').css({
            'transform': `rotate(${-rotation}deg)`
        });
        requestAnimationFrame(spin);
    }
}


        $('.square').on('click', function() {
            if (!spinning) {
                spinning = true;
                spin();
                setTimeout(function() {
                    $('.square').fadeOut(1000, function() {
                        spinning = false;
                        rotationSpeed = 0.5;
                    });
                  }, 5000); // Set duration (in milliseconds) before fading to black
          }
      });
</script>
</body>
</html>
